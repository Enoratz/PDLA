[project]
name = "arithmp"
version = "0.1.0"
description = "Command-line interface for the Arithmp package"
readme = "README.md"
authors = [{ name = "Mikaël Capelle", email = "capelle.mikael@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["click>=8.5.0", "lark>=1.3.1"]

[project.scripts]
arithmp = "arithmp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

#Add proper poethepoet tasks to run linters and type-checkers (check the final branch if needed)
[tool.poe.tasks]
lint = "ruff check src tests"
typecheck = "ty check src"
check = ["lint", "typecheck"]